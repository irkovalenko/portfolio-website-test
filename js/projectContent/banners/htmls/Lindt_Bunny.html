<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="user-scalable=yes, width=320" />
    <title>Lindt</title>
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:500,700&subset=latin"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        line-height: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="lindtbunny320x480adaptivegeowithprice_hype_container"
      class="HYPE_document"
      style="
        margin: auto;
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      "
    ></div>
    <script src="../files/Lindt_Bunny/script.js"></script>

    <script>
      var me = { lat: "{lt}", lon: "{ln}" };
      var points = window.points || [];

      function rad(deg) {
        return (deg * Math.PI) / 180;
      }

      // Haversine distance in km
      function getLength(p1, p2) {
        var dLat = rad(p2.lat - p1.lat);
        var dLon = rad(p2.lon - p1.lon);
        var a =
          Math.sin(dLat / 2) ** 2 +
          Math.sin(dLon / 2) ** 2 *
            Math.cos(rad(p1.lat)) *
            Math.cos(rad(p2.lat));
        return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      window.nearestPlace = points
        .map(function (p) {
          var point = {
            lat: parseFloat(p.Latitude),
            lon: parseFloat(p.Longitude),
            address: p.Ulica + ", " + p.Miasto,
          };
          point.dist = getLength(me, point);
          return point;
        })
        .filter(function (p) {
          return !isNaN(p.lat) && !isNaN(p.lon);
        })
        .sort(function (a, b) {
          return a.dist - b.dist;
        })[0];

      function formatDistance(km) {
        if (typeof km !== "number" || isNaN(km)) return ">10km";
        if (km < 1) return Math.round(km * 1000) + "m";
        return km.toFixed(1) + "km";
      }

      window.gotosite = function () {
        window.open("", "_blank");
      };

      window.gotomap = function () {
        var p = window.nearestPlace;
        if (!p) return;
        window.open(
          "https://www.google.com/maps/search/?api=1&query=" +
            p.lat +
            "," +
            p.lon,
          "_blank",
        );
      };

      window.addEventListener("load", function () {
        var p = window.nearestPlace;
        var address = document.getElementById("address");
        var distance = document.getElementById("distance");
        if (p && address && distance) {
          address.innerText = p.address;
          distance.innerText = formatDistance(p.dist);
        }
      });
    </script>
  </body>
</html>
